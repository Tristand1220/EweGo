# GPS/PPS refclocks — installed to /etc/chrony/sources.d/gps.conf by pi_setup.sh
# only when /dev/pps0 exists (after first reboot with dtoverlay=pps-gpio active).
#
# SHM 0: coarse GPS serial time — noselect, only anchors which second the PPS is on
refclock SHM 0 refid GPS precision 1e-1 poll 2 offset 0.0 noselect
# PPS: sub-microsecond precision, locked to GPS serial for second-boundary
refclock PPS /dev/pps0 refid PPS precision 1e-7 lock GPS poll 1 prefer trust
