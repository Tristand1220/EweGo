# ============================================================================
# GPS PPS Time Synchronization for Raspberry Pi
# ============================================================================

# Use NTP servers as backup when GPS unavailable
pool 0.debian.pool.ntp.org iburst
pool 1.debian.pool.ntp.org iburst
pool 2.debian.pool.ntp.org iburst

# GPS Serial data (coarse time)
# refid: GPS - Reference ID shown in chronyc sources
# precision: ~100ms accuracy (used for rough time)
# poll: check every 4 seconds (2^2)
# prefer: trust this over internet NTP
refclock SHM 0 refid GPS precision 1e-1 poll 2 prefer

# GPS PPS (precise time pulse)
# refid: PPS - Pulse Per Second signal
# precision: ~1 microsecond accuracy
# lock: only use PPS when GPS (SHM 0) is valid
# poll: check every 2 seconds (2^1)
# trust: highest priority time source
refclock PPS /dev/pps0 refid PPS precision 1e-6 lock GPS poll 1 trust

# Allow local network to use this as NTP server (optional)
# Uncomment if you want other Pis to sync to this one
# allow 192.168.1.0/24

# Drift file to remember clock rate
driftfile /var/lib/chrony/drift

# Step clock on start if offset > 1 second
makestep 1.0 3

# RTC (Real-Time Clock) sync
rtcsync

# Log tracking, measurements, statistics
logdir /var/log/chrony
log tracking measurements statistics

# Leap second handling
leapsectz right/UTC
